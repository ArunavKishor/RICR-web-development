<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body id="body">
     <main class="bg-black  container align-items-center mt-3 w-25">
      <div class="nr">
        <div>
            <div class="py-4">
                <input type="text" id="number" placeholder="0" class="p-4">
            </div>
        </div> 
        <div class="d-flex align-items-center justify-content-between gap-4 border-1 rounded mt-1 w-25 pt-2">
            <div><button class="btn bg-white" onclick="Input('7')">7</button></div>
            <div><button class="btn bg-white" onclick="Input('8')">8</button></div>
            <div><button class="btn bg-white" onclick="Input('9')">9</button></div>
            <div><button class="btn bg-white" onclick="Input('/')">/</button></div>
        </div>
        <div class="d-flex align-items-center gap-4 border-1 rounded pt-2">
            <div><button class="btn bg-white" onclick="Input('4')">4</button></div>
            <div><button class="btn bg-white" onclick="Input('5')">5</button></div>
            <div><button class="btn bg-white" onclick="Input('6')">6</button></div>
            <div><button class="btn bg-white " onclick="Input('*')">*</button></div>
        </div>
          <div class="d-flex align-items-center gap-4 border-1 rounded pt-2">
            <div><button class="btn bg-white" onclick="Input('1')">1</button></div>
            <div><button class="btn bg-white" onclick="Input('2')">2</button></div>
            <div><button class="btn bg-white" onclick="Input('3')">3</button></div>
            <div><button class="btn bg-white" onclick="Input('-')">-</button></div>
        </div>
        <div class="d-flex align-items-center gap-4 border-1 rounded pt-2">
            <div><button class="btn bg-white" onclick="Input('.')">.</button></div>
            <div><button class="btn bg-white" onclick="Input('0')">0</button></div>
            <div><button class="btn bg-white" onclick="Input('+')">+</button></div>
            <div><button class="y rounded" onclick="Input('c')">c</button></div>
        </div>
        <div class="d-flex align-items-center gap-4 border-1 rounded pt-2">
            <div class="w" ><button class="rounded" onclick="Input('=')">=</button></div>
            
        </div>
      </div>
     </main>


    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="./script.js"></script>
  </body>
</html>
