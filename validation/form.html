<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <div>
      <h3 class="text-center">Form</h3>
    </div>
    <div class="container w-75">
      <div>
        <div class="d-flex gap-2 mt-3">
          <label for="Name" class="w-25">Name :</label>
          <input type="text" name="name" id="name" class="form-control" />
        </div>
        <span class="text-danger fs-6 float-end Error" id="NameError"
          >
        </span>
      </div>
      <div>
        <div class="d-flex gap-2 mt-3">
          <label for="Name" class="w-25">E-mail :</label>
          <input type="email" name="E-mail" id="Email" class="form-control" />
        </div>
        <span class="text-danger fs-6 float-end Error" id="EmailError"
          >
        </span>
      </div>
      <div>
        <div class="d-flex gap-2 mt-3">
          <label for="Name" class="w-25">Phone no. :</label>
          <input type="number" name="number" id="number" class="form-control" />
        </div>
        <span class="text-danger fs-6 float-end Error" id="NumberError"
          >Error
        </span>
      </div>

      <div>
        <div class="d-flex gap-2 mt-3">
          <label for="Name" class="w-25">DOB :</label
          ><input type="date" name="dob" id="dob" class="form-control" />
        </div>
        <span class="text-danger fs-6 float-end Error" id="DOBError"
          >Error
        </span>
      </div>
    </div>
    <div class="d-flex justify-content-center mt-3">
      <button id="Submit" class="btn btn-primary w-75" onclick="Submit()">
        Submit
      </button>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
