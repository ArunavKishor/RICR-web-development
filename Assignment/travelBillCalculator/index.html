<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Bill Calculator</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body
    class="bg-light d-flex align-items-center justify-content-center min-vh-100"
  >
    <div class="card shadow-lg rounded-4 p-4 w-100" style="max-width: 500px">
      <h4 class="text-center mb-4 fw-semibold">
        <i class="bi bi-calculator"></i> Travel Bill Calculator
      </h4>
      <div class="mb-3">
        <label class="form-label fw-medium">Kilometers Covered</label>
        <input type="number" step="0.1" id="km" class="form-control" />
        <div id="error" class="text-danger small mt-1"></div>
      </div>
      <button class="btn btn-success w-100 py-2" onclick="calculate()">
        Calculate Bill
      </button>
      <div class="mt-4">
        <h5 class="fw-bold">
          Total Bill: <span id="total" class="text-success">Rs. 0</span>
        </h5>
        <div
          id="breakdown"
          class="bg-body-secondary p-3 rounded-3 small mt-2"
        ></div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
