<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Salary Calculator</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body class="bg-primary bg-opacity-50">
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card shadow">
            <div class="card-header bg-primary text-white text-center">
              <h4 class="mb-0">Salary Calculator</h4>
            </div>
            <div class="card-body">
              <div class="mb-2">
                <label class="form-label">Basic Salary</label>
                <input
                  type="number"
                  class="form-control"
                  id="Salary"
                  placeholder="Enter Basic Salary"
                />
                <small class="text-danger" id="errorMsg"></small>
              </div>
              <div class="d-flex gap-2 mt-3">
                <button class="btn btn-success" onclick="CalculateSalary()">
                  <span
                    class="spinner-border spinner-border-sm d-none"
                    role="status"
                  ></span>
                  Calculate Salary
                </button>
                <button class="btn btn-danger" onclick="Reset()">Reset</button>
              </div>
              <div class="alert alert-success mt-3 py-2 d-none" id="successMsg">
                Salary calculated successfully!
              </div>
              <table
                class="table table-bordered mt-3"
                id="salaryTable"
                style="display: none"
              >
                <tr>
                  <th>Basic Salary</th>
                  <td id="Basic"></td>
                </tr>
                <tr>
                  <th>HRA (20%)</th>
                  <td id="Hra"></td>
                </tr>
                <tr>
                  <th>DA (10%)</th>
                  <td id="Da"></td>
                </tr>
                <tr class="table-success">
                  <th>Gross Salary</th>
                  <td id="Gross"></td>
                </tr>
              </table>
              <div class="d-flex mt-3">
                <div id="input" class="flex-grow-1"></div>
                <div id="btn"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
